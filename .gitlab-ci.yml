include:
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file:
      - consumer-repo-config/ci/templates/EmitEvents.gitlab-ci.yml
      - consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
      - consumer-repo-config/ci/templates/UpstreamEnvDrift.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file: consumer-repo-config/release/templates/TagMint.gitlab-ci.yml
    inputs:
      changes:
        - exe/**/*
        - lib/**/*
        - test/**/*
        - .che/**/*
        - Makefile

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain
#[why] a superseded pipeline holds pods for a commit nobody will merge: cancel it and let
#   the autoscaler release the node. jobs with an external side effect opt out individually
default:
  interruptible: true
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

stages:
  - validate
  - release
  - notify

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  ARTIFACT_REGISTRY_PROXY_DOCKERHUB: $GRP_KO_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  CENTRALIZED_ASSETS_GENERIC_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

#[why] ssh-keygen runs for real against a tmpdir HOME: the image carries openssh-client already,
#   so the suite needs no platform auth and no network
unit-tests:
  rules:
    - changes:
        - exe/**/*
        - lib/**/*
        - test/**/*
        - Gemfile
        - Gemfile.lock
        - Makefile
        - .gitlab-ci.yml
  stage: validate
  needs: []
  #[why] ci-linux, not the ruby image: the Makefile runs its recipes under zsh, which the stock
  #   ruby image does not carry, so `make test` dies with "zsh: No such file or directory"
  #[why] debian ships bundler only as the versioned `bundle3.1`, so the unversioned binary is
  #   installed as a user gem and its bindir put on PATH, the same way repo-prepare-deps does it
  #[why] openssh-client: the keypair and rotator suites drive a real ssh-keygen rather than a
  #   double, and ci-linux carries no ssh binaries
  image: $CI_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client > /dev/null
    - command -v bundle >/dev/null || gem install --user-install --no-document bundler
    - export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
    - make install
  script:
    - make test

emit-events:
  extends: .emit-events
  stage: notify
